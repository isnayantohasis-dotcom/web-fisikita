<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gim Edukasi — Fisikita</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --board:#1F3B2E; --board-dark:#152A20; --chalk:#F3EFE3; --chalk-dim:#B9C4B7;
    --paper:#F1EEDF; --paper-card:#FFFFFF; --ink:#26301F; --ink-soft:#5B6350;
    --amber:#E8A33D; --amber-dark:#8A5A16; --blue:#6E9FB0; --blue-soft:#93C9DE;
    --blue-dark:#325366; --line:#E4E0D0;
    --accent:#6B4FA0; --accent-2:#B98FE0; --accent-tint:#EFE7F7;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Plus Jakarta Sans', sans-serif; background:var(--paper); color:var(--ink); line-height:1.6;}
  .mono{font-family:'JetBrains Mono', monospace;}

  header.nav{position:fixed; top:0; left:0; right:0; z-index:50; background:var(--board); border-bottom:3px solid var(--board-dark);}
  .nav-inner{max-width:1100px; margin:0 auto; padding:16px 24px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;}
  .brand{color:var(--chalk); font-weight:700; font-size:1.15rem; display:flex; align-items:center; gap:10px; text-decoration:none;}
  nav.links a{color:var(--chalk-dim); text-decoration:none; font-size:.92rem; font-weight:500;}
  nav.links a:hover{color:var(--amber);}

  .page-head-wrap{padding:36px 24px 0;}
  .page-head{
    max-width:1100px; margin:0 auto; border-radius:26px; overflow:hidden; position:relative;
    background:linear-gradient(120deg, var(--board) 0%, var(--accent) 100%);
    color:var(--chalk); padding:44px 40px; box-shadow:0 20px 40px rgba(31,59,46,0.16);
  }
  .page-head::after{
    content:""; position:absolute; right:-60px; top:-60px; width:220px; height:220px;
    border-radius:50%; background:rgba(255,255,255,0.07);
  }
  .page-head::before{
    content:""; position:absolute; right:40px; bottom:-80px; width:140px; height:140px;
    border-radius:50%; background:rgba(255,255,255,0.06);
  }
  .page-head .tag{
    font-family:'JetBrains Mono', monospace; font-size:.78rem; letter-spacing:.06em; text-transform:uppercase;
    background:rgba(255,255,255,0.14); color:var(--chalk); display:inline-block; padding:6px 14px;
    border-radius:20px; margin-bottom:14px; position:relative;
  }
  .page-head h1{font-size:2.15rem; font-weight:800; margin-bottom:12px; position:relative;}
  .page-head p{color:rgba(243,239,227,0.85); max-width:56ch; position:relative;}

  section{padding:44px 24px 80px;}
  .section-inner{max-width:1100px; margin:0 auto;}

  .res-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:24px;}
  .res-card{
    background:var(--paper-card); border:1px solid var(--line); border-radius:18px;
    overflow:hidden; cursor:pointer; transition:transform .18s, box-shadow .18s;
    box-shadow:0 3px 10px rgba(31,59,46,0.06);
  }
  .res-card:hover{transform:translateY(-4px); box-shadow:0 18px 32px rgba(31,59,46,0.14);}
  .res-thumb{
    height:150px; position:relative; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg, var(--accent), var(--accent-2));
  }
  .res-thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .res-thumb svg{width:36px; height:36px; opacity:.9;}
  .play-chip{
    position:absolute; left:14px; bottom:14px; background:rgba(255,255,255,0.95);
    color:var(--board-dark); font-size:.74rem; font-weight:700; padding:6px 13px; border-radius:20px;
    display:flex; align-items:center; gap:6px; box-shadow:0 4px 10px rgba(0,0,0,0.16);
  }
  .res-body{padding:16px 18px 20px;}
  .res-badge{
    display:inline-flex; align-items:center; gap:6px; font-size:.72rem; font-weight:700;
    color:var(--accent); background:var(--accent-tint); padding:5px 12px; border-radius:20px; margin-bottom:11px;
  }
  .res-badge .dot{width:6px; height:6px; border-radius:50%; background:var(--accent);}
  .res-card h3{font-size:1.05rem; font-weight:700; margin-bottom:4px;}
  .res-card .kelas{font-family:'JetBrains Mono', monospace; font-size:.72rem; color:var(--ink-soft);}

  /* MODAL */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(21,42,32,0.72);
    display:none; align-items:center; justify-content:center; padding:24px; z-index:200;
  }
  .modal-overlay.active{display:flex;}
  .modal-box{
    background:#fff; border-radius:18px; overflow:hidden; width:100%; max-width:820px;
    max-height:82vh; display:flex; flex-direction:column;
    transition:max-width .25s ease, max-height .25s ease, border-radius .25s ease;
  }
  .modal-box.expanded{max-width:100%; max-height:100vh; border-radius:0;}
  .modal-header{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:14px 20px; background:linear-gradient(120deg, var(--board), var(--accent)); color:var(--chalk); flex-shrink:0;
  }
  .modal-header h3{font-size:.98rem; font-weight:700;}
  .modal-actions{display:flex; gap:8px; flex-shrink:0;}
  .modal-actions button{
    background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.3); color:var(--chalk);
    border-radius:8px; padding:6px 12px; font-size:.78rem; cursor:pointer; font-family:inherit; font-weight:600;
  }
  .modal-actions button:hover{background:rgba(255,255,255,0.22);}
  .modal-body{flex:1; background:#fff; min-height:300px;}
  .modal-body iframe{width:100%; height:100%; border:0; display:block; min-height:300px;}
  .modal-empty{
    height:100%; min-height:300px; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:10px; padding:40px; text-align:center; color:var(--ink-soft);
  }
  .modal-empty code{font-family:'JetBrains Mono', monospace; font-size:.82rem; background:#F1EEDF; border:1px solid var(--line); padding:2px 6px; border-radius:4px;}

  footer{background:var(--board-dark); color:var(--chalk-dim); padding:30px 24px; text-align:center; font-size:.85rem;}

  @media(max-width:900px){ .res-grid{grid-template-columns:repeat(2,1fr);} }
  @media(max-width:600px){ .res-grid{grid-template-columns:1fr;} .page-head{padding:34px 24px;} .page-head h1{font-size:1.7rem;} }
</style>
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <a class="brand" href="index.html">
      <svg width="30" height="30" viewBox="0 0 130 130" style="flex-shrink:0;">
        <circle cx="65" cy="30" r="3.2" fill="#F3EFE3"/><circle cx="41" cy="83" r="3.5" fill="#F3EFE3" opacity="0.2"/>
        <circle cx="53" cy="87" r="4" fill="#F3EFE3" opacity="0.35"/><circle cx="65" cy="88.5" r="4.5" fill="#F3EFE3" opacity="0.55"/>
        <circle cx="75" cy="87.7" r="5" fill="#F3EFE3" opacity="0.78"/>
        <line x1="65" y1="30" x2="84" y2="86" stroke="#F3EFE3" stroke-width="2.4" stroke-linecap="round"/>
        <circle cx="84" cy="86" r="9" fill="#E8A33D"/>
      </svg>
      Fisikita <span class="mono" style="font-size:.75rem;color:var(--chalk-dim);font-weight:400;">· SMAN 10 Bulukumba</span>
    </a>
    <nav class="links"><a href="index.html#sumber-belajar">← Kembali ke Sumber Belajar</a></nav>
  </div>
</header>
<script>
  // Header sekarang "fixed" (bukan sticky) supaya konsisten di semua
  // browser mobile. Skrip ini otomatis mengukur tinggi header dan
  // memberi jarak (padding) pada body, supaya konten tidak ketutup.
  (function(){
    function adjustHeaderSpacing(){
      var header = document.querySelector('header.nav');
      if(header){ document.body.style.paddingTop = header.offsetHeight + 'px'; }
    }
    adjustHeaderSpacing();
    window.addEventListener('resize', adjustHeaderSpacing);
  })();
</script>

<div class="page-head-wrap">
  <div class="page-head">
    <span class="tag">Belajar Sambil Bermain</span>
    <h1>Gim Edukasi</h1>
    <p>Klik salah satu kartu untuk memainkan gimnya. Bisa diperluas ke layar penuh dari dalam jendela yang terbuka.</p>
  </div>
</div>

<section>
  <div class="section-inner">
    <div class="res-grid" id="resGrid"></div>
  </div>
</section>

<footer>© 2026 Fisikita — SMAN 10 Bulukumba</footer>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box" id="modalBox">
    <div class="modal-header">
      <h3 id="modalTitle">Judul gim</h3>
      <div class="modal-actions">
        <button id="expandBtn">Perluas</button>
        <button id="closeBtn">Tutup ✕</button>
      </div>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
  // ======================================================
  // DAFTAR LAB MAYA
  // - src   : URL embed lab. Kosongkan ('') kalau belum siap.
  // - image : URL/path gambar PNG/JPG untuk thumbnail kartu.
  //           Taruh file gambar sejajar (folder yang sama) dengan
  //           file HTML ini, lalu isi contoh: 'parabola.png'
  //           Kosongkan ('') untuk pakai ikon+gradien bawaan.
  // ======================================================
  const GAMES = [
    { kelas: 'KELAS X', title: 'Tebak Besaran & Satuan', desc: 'Gim tebak cepat memasangkan besaran dengan satuannya.', src: '', image: '' },
    { kelas: 'KELAS X', title: 'Petualangan Gerak Lurus', desc: 'Selesaikan tantangan level demi level seputar GLB & GLBB.', src: '', image: '' },
    { kelas: 'KELAS XI', title: 'Kuis Skor Usaha & Energi', desc: 'Adu skor menjawab soal usaha, energi, dan daya.', src: '', image: '' },
    { kelas: 'KELAS XII', title: 'Teka-teki Rangkaian Listrik', desc: 'Susun rangkaian yang benar untuk menyalakan lampu virtual.', src: '', image: '' }
    // Contoh menambah gim baru dengan gambar sendiri:
    // { kelas: 'KELAS XI', title: 'Gim Momentum', desc: 'Deskripsi singkat.', src: 'https://link-gim-anda.netlify.app', image: 'gim-momentum.png' },
  ];

  function renderCards(){
    const grid = document.getElementById('resGrid');
    grid.innerHTML = GAMES.map((item, i) => `
      <div class="res-card" onclick="openModal(${i})">
        <div class="res-thumb">
          ${item.image
            ? `<img src="${item.image}" alt="${item.title}">`
            : `<svg viewBox="0 0 24 24" fill="none" stroke="#F3EFE3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="7" width="18" height="12" rx="3"/><path d="M8 11v4M6 13h4M15.5 12.5h.01M18 14.5h.01"/>
              </svg>`}
          <div class="play-chip">▶ Buka</div>
        </div>
        <div class="res-body">
          <span class="res-badge"><span class="dot"></span>Gim</span>
          <h3>${item.title}</h3>
          <div class="kelas">${item.kelas}</div>
        </div>
      </div>
    `).join('');
  }
  renderCards();

  const overlay = document.getElementById('modalOverlay');
  const box = document.getElementById('modalBox');
  const body = document.getElementById('modalBody');
  const titleEl = document.getElementById('modalTitle');
  const expandBtn = document.getElementById('expandBtn');

  function openModal(i){
    const item = GAMES[i];
    titleEl.textContent = item.title;
    body.innerHTML = item.src
      ? `<iframe src="${item.src}" title="${item.title}"></iframe>`
      : `<div class="modal-empty"><p>${item.desc}</p><p>Gim belum dipasang. Isi field <code>src</code> pada objek ini di array <code>GAMES</code>.</p></div>`;
    box.classList.remove('expanded');
    expandBtn.textContent = 'Perluas';
    overlay.classList.add('active');
  }
  function closeModal(){
    overlay.classList.remove('active');
    body.innerHTML = '';
  }
  expandBtn.addEventListener('click', () => {
    box.classList.toggle('expanded');
    expandBtn.textContent = box.classList.contains('expanded') ? 'Perkecil' : 'Perluas';
  });
  document.getElementById('closeBtn').addEventListener('click', closeModal);
  overlay.addEventListener('click', (e) => { if(e.target === overlay) closeModal(); });
  document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeModal(); });
</script>

</body>
</html>
